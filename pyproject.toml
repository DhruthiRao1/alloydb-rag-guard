[project]
name = "alloydb-rag-guard"
version = "0.1.0"
description = "Scan documents for RAG poisoning and quarantine them before they reach an AlloyDB / pgvector store."
requires-python = ">=3.10"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
vertex = ["google-genai>=1.0"]

[project.scripts]
ragguard = "ragguard.cli:main"

[tool.setuptools]
packages = ["ragguard"]

[tool.setuptools.package-data]
ragguard = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
